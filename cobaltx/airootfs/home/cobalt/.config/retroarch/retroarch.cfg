# CobaltX defaults for RetroArch (everything not listed here uses RetroArch's own defaults).
# SDL knows practically every controller - including the "Xbox Elite" pad that
# Handheld Daemon presents on the ROG Ally - so no per-controller profile is needed.
input_joypad_driver = "sdl2"
input_autodetect_enable = "true"

# Player 1 buttons in SDL's standard layout (RetroArch "b" = bottom face button)
input_player1_b_btn = "0"
input_player1_a_btn = "1"
input_player1_y_btn = "2"
input_player1_x_btn = "3"
input_player1_select_btn = "4"
input_player1_start_btn = "6"
input_player1_l3_btn = "7"
input_player1_r3_btn = "8"
input_player1_l_btn = "9"
input_player1_r_btn = "10"
input_player1_up_btn = "11"
input_player1_down_btn = "12"
input_player1_left_btn = "13"
input_player1_right_btn = "14"
input_player1_l2_axis = "+4"
input_player1_r2_axis = "+5"
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+2"
input_player1_r_x_minus_axis = "-2"
input_player1_r_y_plus_axis = "+3"
input_player1_r_y_minus_axis = "-3"

# Open RetroArch's menu in a game: Start + Select
input_menu_toggle_gamepad_combo = "4"

# Touchscreen and mouse in the menus
menu_pointer_enable = "true"
menu_mouse_enable = "true"
