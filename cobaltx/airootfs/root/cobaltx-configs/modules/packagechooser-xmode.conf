# CobaltX installer page: start in X Mode or in the desktop?
# The choice is stored as "packagechooser_xmode" and acted on by
# contextualprocess@xmode at the end of the install.
mode: required
method: legacy
labels:
    step: "X Mode"
items:
    - id: desktop
      name: "Desktop"
      description: "KDE Plasma desktop. Start in the normal CobaltX desktop when I log in. Best for PCs with a keyboard and mouse. X Mode is still available any time from the app menu (\"Switch to X Mode\")."
      screenshot: "/usr/share/cobaltx-xmode/installer-desktop.png"
    - id: xmode
      name: "X Mode"
      description: "X Mode - Handheld Fullscreen Experience. I want X Mode to be turned on when I log in. CobaltX starts straight into a fullscreen, controller-friendly game launcher, like a Steam Deck, and logs you in automatically. You can switch to the desktop any time from the X Mode menu."
      screenshot: "/usr/share/cobaltx-xmode/installer-xmode.png"
